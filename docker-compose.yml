services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: onnest
      POSTGRES_PASSWORD: onnest
      POSTGRES_DB: onnest
    ports:
      - "5432:5432"
    volumes:
      - onnest_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onnest -d onnest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  onnest_postgres_data:
